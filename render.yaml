services:
  - type: web
    name: notes-app-backend
    runtime: node
    region: oregon
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: notes-db
          property: connectionString

databases:
  - name: notes-db
    plan: free
    databaseName: notesapp
    region: oregon
